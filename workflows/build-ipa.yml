name: Build DeliveryNote Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'DeliveryNote/**'
      - 'DeliveryNote.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show native Xcode target
        run: xcodebuild -list -project DeliveryNote.xcodeproj

      - name: Build native SwiftUI app
        run: |
          set -euo pipefail
          xcodebuild \
            -project DeliveryNote.xcodeproj \
            -target DeliveryNote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app, executable, and icon
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DeliveryNote.app"
          test -d "$APP"
          test -f "$APP/DeliveryNote"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP/Info.plist"
          test -f "$APP/Assets.car"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeliveryNote.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload DeliveryNote-unsigned.ipa
          unzip -l DeliveryNote-unsigned.ipa | head -60

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryNote-IPA
          path: DeliveryNote-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
