name: Build DeliveryNote IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          set -e
          xcodebuild \
            -project DeliveryNote.xcodeproj \
            -target DeliveryNote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify app bundle and package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/DeliveryNote.app"
          test -d "$APP"
          test -f "$APP/DeliveryNote"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry DeliveryNote-unsigned.ipa Payload
          unzip -l DeliveryNote-unsigned.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryNote-IPA
          path: DeliveryNote-unsigned.ipa
          retention-days: 14
