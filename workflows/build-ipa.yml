name: Build DeliveryNote IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'DeliveryNote/**', '.github/workflows/build-ipa.yml' ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build unsigned app
        run: |
          xcodebuild -project DeliveryNote.xcodeproj -scheme DeliveryNote -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeliveryNote.app Payload/
          zip -r DeliveryNote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DeliveryNote-IPA
          path: DeliveryNote-unsigned.ipa
          retention-days: 14
