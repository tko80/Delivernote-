name: Build DeliveryNote Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DeliveryNote/**'
      - 'DeliveryNote.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Native SwiftUI App
        run: |
          set -e
          xcodebuild \
            -project DeliveryNote.xcodeproj \
            -target DeliveryNote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify App Icon and Executable
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/DeliveryNote.app"
          test -d "$APP"
          test -f "$APP/DeliveryNote"
          test -d "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist"

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeliveryNote.app Payload/
          /usr/bin/zip -qry DeliveryNote-unsigned.ipa Payload
          unzip -l DeliveryNote-unsigned.ipa | head -50

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryNote-Native-IPA
          path: DeliveryNote-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
