name: Build DeliveryNote Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DeliveryNote/**'
      - 'DeliveryNote.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode project targets
        run: xcodebuild -list -project DeliveryNote.xcodeproj

      - name: Build Native SwiftUI App
        run: |
          set -e
          xcodebuild \
            -project DeliveryNote.xcodeproj \
            -target DeliveryNote \
            -configuration Release \
            -sdk iphoneos \
            -SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify App Bundle
        run: |
          set -e
          APP="$(find build -type d -name 'DeliveryNote.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "DeliveryNote.app was not produced"
            find build -maxdepth 5 -print
            exit 1
          fi
          echo "Found app: $APP"
          test -f "$APP/DeliveryNote"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          if [ ! -f "$APP/Assets.car" ]; then
            echo "Warning: Assets.car missing; check AppIcon asset catalog."
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DeliveryNote.app
          /usr/bin/zip -qry DeliveryNote-unsigned.ipa Payload
          unzip -l DeliveryNote-unsigned.ipa | head -50

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryNote-Native-IPA
          path: DeliveryNote-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
